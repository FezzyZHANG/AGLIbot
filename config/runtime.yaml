data_dir: data            # 运行数据：JSONL 存储、状态、审查队列（gitignore）
mind_dir: mind
work_dir: work            # 任务目录与看板（tasks/ 和 board.yaml 已 gitignore）

session:
  max_turns: 40           # 一个会话最多多少轮，超过就开新会话（L2 用最近记录重建）
  idle_minutes: 360       # 空闲多久后开新会话
  recap_messages: 20      # 新会话的 L2 里带多少条最近聊天记录

routine:                  # 作息：睡眠期间不主动找人；入睡时运行夜间反思
  sleep_at: "01:30:00"
  wake_at: "08:30:00"

heartbeat:
  tick_s: 300             # 内在时钟间隔；状态没有明显变化的 tick 不调用模型
  proactive_gap_hours: 3  # 两次主动找人之间至少隔几小时

memory:
  extract_after: 30       # 某个聊天攒够多少条未提炼的消息就提炼一次（夜间反思也会提炼）
  episodes_in_context: 8  # 新会话的 L2 里最多带几条相关经历
  facts_in_context: 20    # 最多带几条关于对方的事实

hands:
  research: codex         # 研究任务交给谁：codex / off。Claude Code 只归你用，他不调用
  code: codex             # 编码任务交给谁：codex / off（只在 work/tasks/<id>/scratch/ 里写）
  codex_model: gpt-6-astra  # 固定 Codex 用的模型，不跟随 ~/.codex/config.toml 的默认值
  timeout_min: 30

judge:
  digest_at: "21:00:00"   # 每天几点把需要你决定的事项汇总发给你
