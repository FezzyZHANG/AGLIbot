# 场景定义（见 docs/DESIGN.md 5a / 5c）
#   q_min: Q 下限
#   priority: cheap（按 C 升序）/ fast（按 L 升序）/ quality（按 Q 降序）
#   review: 是否走 judge 综合审查
#   budget_exempt: 当日预算用尽后仍保持原优先项（否则强制改走 cheap）
#   effort: 只对 Anthropic 模型生效，覆盖模型默认的 effort

triage:        { q_min: 4, priority: cheap,   effort: low }
chat:          { q_min: 6, priority: fast,    effort: low }
extract:       { q_min: 5, priority: cheap }
consolidate:   { q_min: 6, priority: cheap }
research_plan: { q_min: 8, priority: quality }
verify:        { q_min: 8, priority: quality, review: true, budget_exempt: true }
synthesize:    { q_min: 8, priority: quality }
act:           { q_min: 8, priority: quality, review: true, budget_exempt: true }
evolve:        { model: opus, q_min: 8.8, priority: quality, review: true, budget_exempt: true }
