    \ Some((cosine(query, &vectors.get(&record.hash)?.vector).ok()?, record)))\n \
    \       .collect();\n    scored.sort_by(|a, b| b.0.total_cmp(&a.0));\n    scored.into_iter().take(OFFERED).map(|(_,\
    \ record)| Offer { id: record.hash.chars().take(ID_LEN).collect(), record }).collect()\n"
