  symbol: Evaluation
  claim: 收集评估方案要求按周检查可跨群使用的私人图片，并抽查 100 项去留决定，文档将这些指标列作待验证目标。
  content_hash: f519ffe5f2ebd0599a44f1455f8a883513d533e2b96d29e9e32f636d003e6335
  excerpt: '## Evaluation


    Targets are proposals, not results.


    | Stage | Measure | Target |

    |---|---|---|

    | 1 | Private photos or chat screenshots kept with `scope: any`, one week reviewed
    | none |

    | 1 | Owner agrees with a sample of 100 keep and reject decisions | at least 80%
    |

    | 1 | Same meme re-posted by another sender gives the same hash | measure; decides
    how well repeats are skipped |

    | 1 | Worker delay, arrival to description, p95 | under 60 s |

    '
  created_at: '2026-11-23T19:17:11Z'
  verified_at: '2026-11-23T19:17:11Z'
