  content_hash: 216f2e5c240b56dc43377af36b53def04fe55e0149be1b31ed784ae680298ad7
  excerpt: '## 阅读顺序


    1. [干员档案与语音](corpus/干员/0001_zhuang-fangyi_庄方宜.md)：信赖对话、交谈、礼物、研究与生活习惯。

    2. [穆如清风](corpus/任务/0038_e6m3_穆如清风.md)：研究现场、旧资料与梨花。

    3. [大器晚成](corpus/任务/0059_e10m2_大器晚成.md)：共同研究与接话。

    4. [志同道合](corpus/任务/0061_e10m4_志同道合.md)：旧日回忆与关系语境。

    5. 其他剧情及场景整理见 [来源索引](SOURCES.md)。


    ## 内容分层


    - `corpus/`：AngChow/endfield-story-corpus 的 6 篇任务文本、1 份干员档案与语音，以及原仓库 README/LICENSE。保留说话人、对白编号、分支及上下文，未自行改写。它是社区从华法琳
    Wiki 整理的文本，不是官方发布的独立剧本。

    - `secondary/references/raw/`：MengPaul07/zhuang-fangyi-skill 的 21 份整理稿。即使上游目录叫
    raw，也可能混有演出观察、近原文整理、角色解读和未核实内容；不可直接当作游戏逐字原文。原仓库 README 中的演绎例子同样不是官设台词。

    '
  created_at: '2026-11-23T19:17:11Z'
  verified_at: '2026-11-23T19:17:11Z'
