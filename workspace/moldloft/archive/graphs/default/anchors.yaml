  content_hash: ec79910bf9b0e0b245ec9a5f417f6a8d4761e42da29e3524d0c91989a117eb62
  excerpt: '| R15 | P2 | 5 / `463363c` | `src/bot/jobs.rs:46`、`:50`、`:68`；`src/work/board.rs:166`；`src/store/mongo/tasks.rs:91`
    | Mongo 的快照比较能防字段覆盖，但状态转换不校验期望前态。`Active` 已写入后，日志或审计失败也没有补偿。 | 审计写入失败，任务留在 `Active`，没有工作器，手动
    `/run` 被拒绝，直到重启恢复。两个实例也可能先后把同一任务认领为活动任务。 | 在一次条件更新中认领允许的前态并生成 attempt ID。启动失败可回收，完成和停止只结算同一
    attempt。 |

    | R16 | P2 | 2 / `35a51f0` | `src/store/mongo.rs:20`、`:279`；`src/mind/reflect.rs:168`
    | BSON 把时间截到毫秒，反思水位仍是单个时间戳，续读只查严格大于它的消息。旧 Mongo 路径保留 JSON 中的更高精度并作精确比较。 | 两条消息在同一毫秒内先后写入，第一条之后已推进水位，则第二条仍在消息库里，却不会再由该水位读出。离线探针在采用相同精度的
    MemStore 上复现。 | 改用 `(ts, _id)` 稳定游标，并为旧时间水位提供兼容读取。 |

    '
  created_at: '2026-11-23T19:17:11Z'
  verified_at: '2026-11-23T19:17:11Z'
