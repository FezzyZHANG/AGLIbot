  claim: 在 590a346，未结承诺按截至三天后的到期日筛选，对可见范围和本地模型条件作检查，再排序并限五条。
  content_hash: 13ecdd1f72ae856a707b10ab234afddd1451f268e8425a234e7afe50bba3ddc9
  excerpt: "pub fn due_soon(store: &dyn Store, today: NaiveDate, has_local: bool)\
    \ -> Result<Vec<Commitment>> {\n    let mut items: Vec<_> = load(store)?.into_iter().filter(|c|\
    \ {\n        c.status == Status::Open && c.due.is_some_and(|d| d <= today + Duration::days(3))\n\
    \            && (has_local || c.scope != Scope::SelfOnly)\n    }).collect();\n\
    \    items.sort_by(|a, b| (a.due, a.created, &a.id).cmp(&(b.due, b.created, &b.id)));\n\
    \    items.truncate(5);\n    Ok(items)\n"
  created_at: '2026-11-23T19:17:13Z'
  verified_at: '2026-11-23T19:17:13Z'
