  symbol: rank
  claim: 表情候选必须处于启用状态、在当前会话可用且可发送，然后按与查询的余弦相似度排序。
  content_hash: db9912e091a20582eb52db7988c61779647145bdc7c583a9440a4d5bd05d19d6
  excerpt: "fn usable(record: &MediaRecord, chat: &str) -> bool {\n    record.status\
    \ == MediaStatus::Active && (record.scope == StickerScope::Any || record.origin\
    \ == chat)\n}\n\n/// The closest usable stickers. No similarity floor: unrelated\
    \ lines score as high as good matches\n/// (docs/research/sticker-store.md), so\
    \ he decides whether any of them fits.\nfn rank(query: &[f32], vectors: &BTreeMap<String,\
    \ StickerVector>, media: Vec<MediaRecord>, chat: &str, sendable: impl Fn(&MediaRecord)\
    \ -> bool) -> Vec<Offer> {\n    let mut scored: Vec<(f64, MediaRecord)> = media.into_iter()\n\
    \        .filter(|record| usable(record, chat) && sendable(record))\n        .filter_map(|record|\
    \ Some((cosine(query, &vectors.get(&record.hash)?.vector).ok()?, record)))\n \
    \       .collect();\n    scored.sort_by(|a, b| b.0.total_cmp(&a.0));\n    scored.into_iter().take(OFFERED).map(|(_,\
    \ record)| Offer { id: record.hash.chars().take(ID_LEN).collect(), record }).collect()\n\
    }\n"
  created_at: '2026-11-23T19:17:11Z'
  verified_at: '2026-11-23T19:17:11Z'
