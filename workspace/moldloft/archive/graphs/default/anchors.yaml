  content_hash: b40bd7e33d88b877f83d31f60428454da795b79aa7743ef67377599b4f135675
  excerpt: "fn material(task: &Task, dir: &Path, existing_topics: BTreeSet<String>)\
    \ -> Result<Material> {\n    #[derive(Deserialize)]\n    #[serde(untagged)]\n\
    \    enum Ledger { List(Vec<Claim>), Wrapped { claims: Vec<Claim> } }\n    let\
    \ report = read_optional(dir, \"report.md\")?;\n    let yaml = read_optional(dir,\
    \ \"claims.yaml\")?;\n    let mut claims = if yaml.trim().is_empty() { Vec::new()\
    \ } else {\n        match serde_yaml::from_str::<Ledger>(&yaml).context(\"parsing\
    \ research claims.yaml\")? {\n            Ledger::List(v) | Ledger::Wrapped {\
    \ claims: v } => v,\n        }\n    };\n    if claims.is_empty() && !report.trim().is_empty()\
    \ {\n        // Offline research has no ledger. Preserve its report explicitly\
    \ as an unverified claim.\n        claims.push(Claim { claim: report.clone(),\
    \ source: \"report.md\".into(), kind: \"secondary\".into(), status: \"claimed\"\
    .into(), confidence: 0.0 });\n    }\n"
  created_at: '2026-11-23T19:17:13Z'
  verified_at: '2026-11-23T19:17:13Z'
