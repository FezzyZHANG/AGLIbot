  claim: 别名匹配跳过引用并检查群范围，黑话按群范围和词长筛选，同词优先采用本群释义。
  content_hash: 77d604e4ea3ad53125f01202f1eed2c8f1e22f125a89521e7c416a89308c6be7
  excerpt: "    /// The alias a message in `group` calls him by.\n    pub fn called_by(&self,\
    \ group: &str, text: &str) -> Option<&str> {\n        let text = without_quote(text).to_lowercase();\n\
    \        self.entries.iter()\n            .filter(|e| e.kind == Kind::Alias &&\
    \ e.applies_to(group))\n            .find(|e| text.contains(&e.term.to_lowercase()))\n\
    \            .map(|e| e.term.as_str())\n    }\n\n    /// One `<当前状态>` line explaining\
    \ the slang that appears in `text` (quotes included), or None.\n    pub fn slang_note(&self,\
    \ group: &str, text: &str) -> Option<String> {\n        let text = text.to_lowercase();\n\
    \        let mut hits: Vec<&Entry> = self.entries.iter()\n            .filter(|e|\
    \ e.kind == Kind::Slang && e.applies_to(group) && text.contains(&e.term.to_lowercase()))\n\
    \            .collect();\n        // A group-scoped meaning overrides a global\
    \ one for the same term.\n        hits.sort_by(|a, b| b.term.chars().count().cmp(&a.term.chars().count())\n\
    \            .then_with(|| a.term.cmp(&b.term)).then_with(|| b.scope.is_some().cmp(&a.scope.is_some())));\n\
    \        hits.dedup_by(|b, a| a.term == b.term);\n        hits.truncate(SLANG_MAX);\n\
    \        (!hits.is_empty()).then(|| {\n            format!(\"群里的说法：{}\", hits.iter().map(|e|\
    \ format!(\"{}＝{}\", e.term, e.meaning)).collect::<Vec<_>>().join(\"；\"))\n  \
    \      })\n"
  created_at: '2026-11-23T19:17:11Z'
  verified_at: '2026-11-23T19:17:11Z'
