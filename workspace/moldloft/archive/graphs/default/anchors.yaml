  claim: 在 590a346，专注统计按专注时间窗汇总模型调用次数、缓存命中份额和费用。
  content_hash: 61bb443b63afbc481ecbc1174ef1572a92331b1a5f7fecb2ef65547c5b8fe63d
  excerpt: "pub fn record(store: &dyn Store, models: &[ModelEntry], flow: &super::flow::Flow,\
    \ until: DateTime<Utc>) -> Result<()> {\n    let Some(since) = flow.since.filter(|_|\
    \ flow.is_focused()) else { return Ok(()) };\n    let calls = store.model_calls_between(since,\
    \ until)?;\n    let mut session = Totals::default();\n    let parts: Vec<String>\
    \ = totals(&calls, models).into_iter().map(|((provider, model), t)| {\n      \
    \  session.calls += t.calls;\n        session.cached = session.cached.saturating_add(t.cached);\n\
    \        session.uncached = session.uncached.saturating_add(t.uncached);\n   \
    \     session.cost_usd += t.cost_usd;\n        format!(\"{provider}/{model}: calls={},\
    \ cached_share={:.4}, cached_input={}, uncached_input={}, cost_usd={:.6}\",\n\
    \            t.calls, t.cached_share(), t.cached, t.uncached, t.cost_usd)\n  \
    \  }).collect();\n    let line = format!(\"flow cache metrics task={} window=[{since},{until})\
    \ calls={} cached_share={:.4} cost_usd={:.6} [{}] (time-window attribution)\"\
    ,\n        flow.task_id.as_deref().unwrap_or(\"unknown\"), session.calls, session.cached_share(),\
    \ session.cost_usd, parts.join(\"; \"));\n    tracing::info!(\"{line}\");\n"
  created_at: '2026-11-23T19:17:13Z'
  verified_at: '2026-11-23T19:17:13Z'
