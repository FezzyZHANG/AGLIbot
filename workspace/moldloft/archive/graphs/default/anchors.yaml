  symbol: Who may write core code
  claim: 本票涉及的核心代码须遵守仓库的实现者资格，L4 修改仅限所有者。
  content_hash: b5411095bdb78a654e8af4be1a151236a929629535f188f37acac60712fed361
  excerpt: "Core code is `src/` and anything at L3 or above in [DESIGN section 6](docs/DESIGN.md#6-自进化与安全).\n\
    L4 (`config/`, boundaries) is owner-only regardless of model. The in-process evolution\
    \ gate\n(`evolution/gate.rs`) was retired with the owner's sign-off on 2026-11-23;\
    \ core code now ships only\nthrough Git and `ops/deploy.ps1`, and bringing a gate\
    \ back is itself an L4 change the owner starts.\n\n- **Direct writers:** Astra\
    \ (`gpt-6-astra`, via Codex) and Opus (via the owner's Claude Code).\n- **Directed\
    \ writer:** `deepseek-v4.1-flash-1017`, only for well-defined tasks. A task is\n\
    \  well-defined when an advanced model (Astra or Opus) directs it: the director\
    \ writes the\n  plan, names the files and interfaces to touch and the tests that\
    \ decide acceptance, and\n  reviews the resulting diff before it reaches the owner.\
    \ The directed model does not widen\n  scope; on ambiguity it stops and hands\
    \ back to the director instead of guessing.\n- **Everyone else** (other models,\
    \ and AGLI's own chat/judge models) may read and propose,\n  never write core\
    \ code.\n"
  created_at: '2026-11-23T19:17:11Z'
  verified_at: '2026-11-23T19:17:11Z'
