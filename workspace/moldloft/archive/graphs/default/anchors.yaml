  symbol: Privacy, risks and evaluation
  claim: 图像验收方案列出 16 个样例，以及截图文字准确率和 p95 延迟目标，文档注明这些数值仍待测量。
  content_hash: 485d530791a26d38cdb93ea31a7759b16ee85ecb49efc2100f88122f4e6b231c
  excerpt: 'Proposed 16 fixtures: (1) ordinary object; (2) Chinese screenshot; (3)
    mixed Chinese/English; (4) receipt amounts; (5) tiny text; (6) rotated photo;
    (7) ambiguous meme; (8) chart; (9) two-image comparison; (10) four-image ordering;
    (11) TG album/late item; (12) expired QQ URL; (13) oversized/corrupt file; (14)
    image prompt injection; (15) private-to-group leak; (16) SelfOnly/LocalOnly with
    cloud-only capability.


    Owner-labelled targets: ≥90% required facts on readable fixtures; ≥95% character
    accuracy on clear printed text; zero invented critical amounts; 100% policy/limit/injection
    cases safe. Measure three warm repeats plus cold start: provisional cloud p95
    ≤10 seconds to caption; local p95 ≤30 seconds. Targets are not measured results.
    Track failures, total reply latency and cost; 16 cases are a smoke gate, not statistical
    proof.

    '
  created_at: '2026-11-23T19:17:11Z'
  verified_at: '2026-11-23T19:17:11Z'
