    only board.yaml. Owner follow-ups stored in work/tasks/<id>/followups.md are dropped,
    so /run executes the original title and can still pass review.\n\nImport them
    idempotently and restore the consumed position from reviewed_followups_bytes.
    Follow-ups that cannot be matched stay unprocessed.", "tech_notes": "src/work/board.rs:56,
    :64; src/store/mod.rs:350; src/work/mod.rs:155. An offline probe reproduced an
    empty import.", "parent_id": "new:blockers"}}, {"op": "ticket_create", "temp_id":
    "new:r14", "fields": {"title": "Route Telegram file downloads through TELEGRAM_PROXY
    (R14)", "group_name": "Refactor 2026-11-22", "priority": "high", "description":
    "getFile uses the configured proxy, but the file download goes through urls::download
