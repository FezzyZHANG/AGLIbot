    R17 in #95; R18 in #94; R20-R22 in the research-executor ticket; R12 in n-agli-dec-triage-20261123.\n\nWriter:
    the owner assigns one under root AGENTS.md.", "tech_notes": ""}}, {"op": "ticket_create",
    "temp_id": "new:lessons", "fields": {"title": "Restore lessons and Widen with
    a chat reader and revocable public copies", "group_name": "Memory", "priority":
    "medium", "description": "Owner sign-off 2026-11-23: restore lessons and Widen
    together. At 590a346 only solo thinking and the journal read lessons, and only
    with a local model; chat recall passed include_lessons: false, so the 255 public
    copies never reached a conversation. Restoring therefore includes building the
    first chat reader.\n\nDesign changes from the live-data review (n-agli-ev-lessons-widen-20261123):\n1.
    Auto-pass only on an allowlist: group-sourced, low-sensitivity lessons that stand
    on their own without the original event. Always send to the owner: private-chat
    sources; identifiable health, relationship, family, finance or workplace-conflict
    content; group nicknames or jokes; unpublished research; anything that guesses
    someone''s wishes. Stop lessons that encourage deception, mockery or bypassing
    permissions at the private stage.\n2. Make the judgement checkable. Verify answers
    three questions: which two clues would let an acquaintance recognize the source;
    what the original teller might mind; whether it labels people or encourages misconduct.
    The review obeys processing policy instead of ProcessingPolicy::Any. Record forwarded,
    call failure, unparseable output and verdict/reason mismatch separately, with
    the raw output. For each new model or prompt version, compare 50 items by hand,
    then sample 20% of auto-passes. These are starting values, not proven thresholds.\n3.
    Make copies revocable before any chat reader. A pass creates one derived item
    bound to source, text version, audience and processing policy; a rewrite approves
    only the new text; revocation also clears search indexes and session caches.\n\nAcceptance:
