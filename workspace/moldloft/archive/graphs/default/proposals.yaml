    reviews; no Evolve or probe reviews. The live bot still runs 590a346 from the
    xiaozhuang-20261103 runtime."}}, {"op": "ticket_create", "temp_id": "new:r07",
    "fields": {"title": "Run a backed-up, verified migrate-bson step before switching
    releases (R07)", "group_name": "Refactor 2026-11-22", "priority": "high", "description":
    "The new build refuses the legacy Mongo schema at startup, but ops/deploy.ps1
    and DEPLOY.md write the new release pointer and stop the old bot first, so a normal
    deploy ends with no bot running. migrate-bson --apply has no backup step.\n\nAdd
    a read-only schema preflight before switching. When migration is needed: stop
    both writers (bot and stickers-web), mongodump, migrate, verify the round trip
    on a copy, then switch the pointer and check readiness. Also fold in R08 (unknown
    or retired subcommands such as import-jsonl must exit non-zero instead of starting
    the bot) and R24 (deploy -Commit 590a346 fails because it always builds the stickers-web
    bin).", "tech_notes": "src/store/mod.rs:412; ops/deploy.ps1:22, :50, :69; ops/start-bot.ps1:26;
    src/main.rs:26, :68; src/store/migrate.rs:73, :158.", "parent_id": "new:blockers"}},
    {"op": "ticket_create", "temp_id": "new:r01", "fields": {"title": "Keep Episode.sources
    and archive state through migrate-bson (R01)", "group_name": "Refactor 2026-11-22",
    "priority": "high", "description": "migrate-bson round-trips legacy Episode records
    through the new struct and drops sources, and the new episodes() returns archived
    originals to recall. No episode is archived in the live store yet (2026-11-23),
    so nothing is lost today, but the field and the archive state must survive before
    archiving comes back.\n\nAcceptance: a legacy fixture with a summary and its originals
    keeps the same effective recall set after migration, and running the migration
    twice changes nothing.", "tech_notes": "src/store/migrate.rs:176, :227, :284;
    src/store/mongo.rs:326. The current migration test asserts that the field disappears.",
    "parent_id": "new:blockers"}}, {"op": "ticket_create", "temp_id": "new:r02", "fields":
